[project]
name = "mention_localizer"
version = "0.1.0"
description = "Locate a known text mention on a scanned page and return its IIIF region."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rapidfuzz>=3.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
